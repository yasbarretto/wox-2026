name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject chatbot config from secrets
        env:
          CHAT_ENDPOINT: ${{ vars.CHAT_ENDPOINT }}
          CHAT_API_TOKEN: ${{ secrets.CHAT_API_TOKEN }}
        run: |
          if [ -z "$CHAT_ENDPOINT" ] || [ -z "$CHAT_API_TOKEN" ]; then
            echo "::error::CHAT_ENDPOINT and CHAT_API_TOKEN secrets must be set"
            exit 1
          fi
          sed -i "s|__CHAT_ENDPOINT__|$CHAT_ENDPOINT|g; s|__CHAT_API_TOKEN__|$CHAT_API_TOKEN|g" chatbot.js
          if grep -qE "__CHAT_ENDPOINT__|__CHAT_API_TOKEN__" chatbot.js; then
            echo "::error::Placeholder substitution failed"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
